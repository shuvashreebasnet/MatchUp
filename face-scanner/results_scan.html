<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MatchUp - Results</title>
  <link rel="stylesheet" href="../navigation-bar/styles.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Karla:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root { --pink: #f7a0b0; --border: #9f1f47; --green: #CEE9C7; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; background: #eee; font-family: Karla, sans-serif; color: #000; }
    .phone { position: relative; width: 100%; max-width: 393px; min-height: 100svh; margin: 0 auto; overflow: hidden; background: linear-gradient(#fdecef 0%, #fffafa 55%, #fff 100%); }
    .page {
    height: 100%;
    min-height: 0;
    padding: 22px 15px 94px;
    overflow-y: auto;
    }
    .top-button { position: absolute; z-index: 2; top: 22px; width: 45px; height: 45px; padding: 10px; border: 0; border-radius: 15px; background: #fff; box-shadow: 0 5px 5px rgba(0,0,0,.25); cursor: pointer; }
    .top-button.back { left: 15px; } .top-button.restart { right: 15px; }
    .top-button img { width: 100%; height: 100%; object-fit: contain; }
    h1 { margin: 56px 0 18px; text-align: center; font-size: 48px; line-height: 1; font-weight: 500; }
    .shade-result { width: 100%; height: 195px; display: flex; flex-direction: column; justify-content: center; align-items: center; margin-bottom: 18px; border: 4px solid #000; border-radius: 40px; background: #cc987d; transition: background-color .35s ease; }
    .shade-name { margin: 0 0 7px; font-size: 50px; line-height: 1; font-weight: 500; }
    .shade-details { margin: 0; font-size: 26px; }
    .pink-pills, .green-pills { display: flex; justify-content: space-between; gap: 12px; width: 100%; }
    .pink-pills { margin-bottom: 20px; } .green-pills { margin-bottom: 10px; }
    .pill { flex: 1; min-width: 0; height: 38px; display: flex; justify-content: center; align-items: center; border-radius: 25px; font-size: 17px; white-space: nowrap; }
    .pink-pills .pill { background: var(--pink); } .green-pills .pill { background: var(--green); }
    .preference-title { margin: 0 0 8px; font-size: 16px; font-weight: 700; }
    .product-card { position: relative; width: 100%; max-width: 367px; height: 366px; margin: 0 auto 16px; padding: 242px 18px 12px; border-radius: 30px; background: #fff; box-shadow: 0 5px 6px rgba(0,0,0,.25); touch-action: pan-y; }
    .product-image { position: absolute; top: 24px; left: 50%; width: 180px; height: 180px; transform: translateX(-50%); object-fit: contain; }
    .favorite-button { position: absolute; top: 12px; right: 13px; z-index: 2; width: 60px; height: 60px; padding: 0; border: 0; border-radius: 50%; background: transparent; cursor: pointer; }
    .favorite-button img { width: 100%; height: 100%; object-fit: contain; }
    .product-name { margin: 0; font-size: 30px; line-height: 1.15; font-weight: 600; }
    .product-price { margin: 2px 0 0; font-size: 31px; font-weight: 600; }
    .dots { display: flex; justify-content: center; gap: 27px; margin-bottom: 29px; }
    .dot { width: 19px; height: 19px; padding: 0; border: 0; border-radius: 50%; background: #d9d9d9; cursor: pointer; }
    .dot.active { background: #000; }
    .product-card.slide-left { animation: slideLeft .25s ease; } .product-card.slide-right { animation: slideRight .25s ease; }
    @keyframes slideLeft { from { opacity: .35; transform: translateX(24px); } to { opacity: 1; transform: translateX(0); } }
    @keyframes slideRight { from { opacity: .35; transform: translateX(-24px); } to { opacity: 1; transform: translateX(0); } }
    .explore-button { display: block; width: calc(100% - 40px); height: 68px; margin: 0 auto; border: 1px solid var(--border); border-radius: 100px; background: var(--pink); box-shadow: 0 5px 6px rgba(0,0,0,.25); font: 400 30px Karla, sans-serif; cursor: pointer; }
    @media (max-width: 393px) { .phone { width: 100%; } }
  </style>
</head>
<body>
  <main class="phone">
    <section class="page">
      <button class="top-button back" type="button" aria-label="Back to intro"><img src="../assets/back_arrow.png" alt=""></button>
      <button class="top-button restart" type="button" aria-label="Restart scan"><img src="../assets/restart_arrow.png" alt=""></button>
      <h1>Your Results</h1>

      <section class="shade-result" id="shadeResult">
        <p class="shade-name" id="shadeName">Medium Match</p>
        <p class="shade-details" id="shadeDetails">Skin depth: Medium</p>
      </section>

      <div class="pink-pills">
        <div class="pill" id="eyePill">Eye: Almond</div>
        <div class="pill" id="nosePill">Nose: Straight</div>
        <div class="pill" id="facePill">Face: Oval</div>
      </div>

      <!-- Preferences are intentionally left unchanged for now. -->
      <p class="preference-title">Your Preferences:</p>
      <div class="green-pills"><div class="pill">Skin type: Dry</div><div class="pill">Cruelty-Free</div><div class="pill">Environment</div></div>

      <section class="product-card" id="productCard">
        <button class="favorite-button" id="favoriteButton" type="button" aria-label="Favorite product">
          <img id="favoriteImage" src="../assets/hearted.png" alt="">
        </button>
        <img class="product-image" id="productImage" src="../assets/mac_foundation.png" alt="MAC foundation">
        <p class="product-name" id="productName">MAC Studio Radiance<br>Foundation</p>
        <p class="product-price" id="productPrice">$46.00</p>
      </section>

      <div class="dots" aria-label="Product matches">
        <button class="dot active" type="button" data-product="0" aria-label="Show product 1"></button>
        <button class="dot" type="button" data-product="1" aria-label="Show product 2"></button>
        <button class="dot" type="button" data-product="2" aria-label="Show product 3"></button>
      </div>
      <button class="explore-button" type="button">Explore More</button>
    </section>

    <div id="navbar-container"></div>
  </main>

  <script src="../navigation-bar/script.js"></script>
  <script>
    const skinColors = { Fair: "#F7DCC8", Light: "#E9B99B", Medium: "#CC987D", Tan: "#A9684D", Deep: "#75402F" };
    const productsByDepth = {
      Fair: [
        { name: "MAC Studio Radiance<br>Foundation", price: "$46.00", image: "../assets/makeup-products/mac_n11.png", alt: "MAC N11 foundation" },
        { name: "Fenty Pro Filt'r<br>Foundation", price: "$40.00", image: "../assets/makeup-products/fenty_100.png", alt: "Fenty shade 100 foundation" },
        { name: "NARS Light Reflecting<br>Foundation", price: "$55.00", image: "../assets/makeup-products/nars_oslo.png", alt: "NARS Oslo foundation" }
      ],

      Light: [
        { name: "MAC Studio Radiance<br>Foundation", price: "$46.00", image: "../assets/makeup-products/mac_nc20.png", alt: "MAC NC20 foundation" },
        { name: "Fenty Pro Filt'r<br>Foundation", price: "$40.00", image: "../assets/makeup-products/fenty_185.png", alt: "Fenty shade 185 foundation" },
        { name: "NARS Light Reflecting<br>Foundation", price: "$55.00", image: "../assets/makeup-products/nars_fiji.png", alt: "NARS Fiji foundation" }
      ],

      Medium: [
        { name: "MAC Studio Radiance<br>Foundation", price: "$46.00", image: "../assets/makeup-products/mac_foundation.png", alt: "MAC NC40 foundation" },
        { name: "Fenty Pro Filt'r<br>Foundation", price: "$40.00", image: "../assets/makeup-products/fenty_foundation.png", alt: "Fenty shade 310 foundation" },
        { name: "NARS Light Reflecting<br>Foundation", price: "$55.00", image: "../assets/makeup-products/nars_foundation.png", alt: "NARS Syracuse foundation" }
      ],

      Tan: [
        { name: "MAC Studio Radiance<br>Foundation", price: "$46.00", image: "../assets/makeup-products/mac_nc45.png", alt: "MAC NC45 foundation" },
        { name: "Fenty Pro Filt'r<br>Foundation", price: "$40.00", image: "../assets/makeup-products/fenty_330.png", alt: "Fenty shade 330 foundation" },
        { name: "NARS Light Reflecting<br>Foundation", price: "$55.00", image: "../assets/makeup-products/nars_barcelona.png", alt: "NARS Barcelona foundation" }
      ],

      Deep: [
        { name: "MAC Studio Radiance<br>Foundation", price: "$46.00", image: "../assets/makeup-products/mac_nc50.png", alt: "MAC NC50 foundation" },
        { name: "Fenty Pro Filt'r<br>Foundation", price: "$40.00", image: "../assets/makeup-products/fenty_450.png", alt: "Fenty shade 450 foundation" },
        { name: "NARS Light Reflecting<br>Foundation", price: "$55.00", image: "../assets/makeup-products/nars_manaus.png", alt: "NARS Manaus foundation" }
      ]
    };

    const params = new URLSearchParams(window.location.search);
    const skinDepth = productsByDepth[params.get("skinDepth")] ? params.get("skinDepth") : "Medium";
    const eyeShape = params.get("eyeShape") || "Almond";
    const noseShape = params.get("noseShape") || "Straight";
    const faceShape = params.get("faceShape") || "Oval";
    const products = productsByDepth[skinDepth];
    let currentProductIndex = 0;
    const favoriteStates = [false, false, false];

    document.getElementById("shadeResult").style.backgroundColor = skinColors[skinDepth];
    document.getElementById("shadeName").textContent = `${skinDepth} Match`;
    document.getElementById("shadeDetails").textContent = `Skin depth: ${skinDepth}`;
    document.getElementById("eyePill").textContent = `Eye: ${eyeShape}`;
    document.getElementById("nosePill").textContent = `Nose: ${noseShape}`;
    document.getElementById("facePill").textContent = `Face: ${faceShape}`;

    const card = document.getElementById("productCard");
    const productImage = document.getElementById("productImage");
    const productName = document.getElementById("productName");
    const productPrice = document.getElementById("productPrice");
    const favoriteButton = document.getElementById("favoriteButton");
    const favoriteImage = document.getElementById("favoriteImage");
    const dots = document.querySelectorAll(".dot");

    function updateFavoriteImage() {
      favoriteImage.src = favoriteStates[currentProductIndex] ? "../assets/clicked_heart.png" : "../assets/hearted.png";
    }

    function showProduct(index, direction = "left") {
      currentProductIndex = index;
      const product = products[index];
      productName.innerHTML = product.name;
      productPrice.textContent = product.price;
      productImage.src = product.image;
      productImage.alt = product.alt;
      dots.forEach((dot, dotIndex) => dot.classList.toggle("active", dotIndex === index));
      updateFavoriteImage();
      card.classList.remove("slide-left", "slide-right");
      void card.offsetWidth;
      card.classList.add(direction === "right" ? "slide-right" : "slide-left");
    }

    dots.forEach((dot) => dot.addEventListener("click", () => {
      const nextIndex = Number(dot.dataset.product);
      showProduct(nextIndex, nextIndex < currentProductIndex ? "right" : "left");
    }));

    favoriteButton.addEventListener("mouseenter", () => {
      if (!favoriteStates[currentProductIndex]) favoriteImage.src = "../assets/hover_heart.png";
    });
    favoriteButton.addEventListener("mouseleave", updateFavoriteImage);
    favoriteButton.addEventListener("click", (event) => {
      event.stopPropagation();
      favoriteStates[currentProductIndex] = !favoriteStates[currentProductIndex];
      updateFavoriteImage();
    });

    let startX = 0;
    card.addEventListener("touchstart", (event) => { startX = event.changedTouches[0].screenX; }, { passive: true });
    card.addEventListener("touchend", (event) => {
      const distance = event.changedTouches[0].screenX - startX;
      if (Math.abs(distance) < 50) return;
      const next = distance < 0 ? (currentProductIndex + 1) % products.length : (currentProductIndex - 1 + products.length) % products.length;
      showProduct(next, distance < 0 ? "left" : "right");
    }, { passive: true });

    document.querySelector(".back").addEventListener("click", () => { window.location.href = "intro_scan.html"; });
    document.querySelector(".restart").addEventListener("click", () => { window.location.href = "face_scan.html"; });
    document.querySelector(".explore-button").addEventListener("click", () => alert("Explore More coming soon!"));
    showProduct(0);
  </script>
</body>
</html>
