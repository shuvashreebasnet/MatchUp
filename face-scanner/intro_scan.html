<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />

  <!-- Makes the page responsive on different mobile devices -->
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  />

  <title>MatchUp - Makeup Recommender</title>

  <link rel="stylesheet" href="../navigation-bar/styles.css">
  <!-- Imports the Karla font used throughout the page -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Karla:wght@400;500;600;700;800&display=swap"
    rel="stylesheet"
  >

  <style>
    /* Main colors */
    :root {
      --pink: #f7a0b0;
      --border: #9f1f47;
      --page-pink: #fff5f6;
    }

    /* Makes sizing easier to control */
    * {
      box-sizing: border-box;
    }

    /* General page styling */
    body {
      margin: 0;
      min-height: 100vh;
      background: #eeeeee;
      font-family: Karla, sans-serif;
      color: #000;
    }

    /* Responsive mobile frame */
    .phone {
      position: relative;
      width: 100%;
      max-width: 393px;
      height: 100svh;
      min-height: 600px;
      margin: 0 auto;
      overflow: hidden;

      background: linear-gradient(
        #fdecef 0%,
        var(--page-pink) 55%,
        #fff 100%
      );
    }

    /* Main page content */
    .content {
      height: 100%;
      min-height: 0;

      padding: 38px 18px 110px;
      overflow-y: auto;
    }

    /* Welcome heading */
    h1 {
      margin: 35px 0 38px;
      text-align: center;
      font-size: 34px;
      line-height: 1;
      font-weight: 700;
    }

    /* Main page title */
    .title {
      margin: 0 auto 32px;
      text-align: center;
      font-size: 40px;
      line-height: 0.95;
      font-weight: 800;
      letter-spacing: 1px;
    }

    /* How-it-works heading */
    .how-it-works {
      margin: 0 0 10px;
      text-align: center;
      font-size: 20px;
      font-weight: 400;
    }

    /* Holds all instruction cards */
    .steps {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    /* Individual instruction card */
    .step-card {
      display: flex;
      align-items: center;
      width: 100%;
      min-height: 290px;
      padding: 14px;

      border-radius: 26px;
      background: #fff;
      box-shadow: 0 7px 6px rgba(0, 0, 0, 0.25);
    }

    /*
      Instruction image sizing.

      The first card still uses a grey placeholder.
      The second and third cards use the scanner screenshots.
    */
    .step-image {
      flex: 0 0 120px;
      width: 120px;
      height: 250px;
      margin-right: 20px;

      border-radius: 12px;
      background: #d9d9d9;
      box-shadow: 0 3px 6px rgba(0, 0, 0, 0.2);

      object-fit: contain;
      object-position: center;
    }

    /* Instruction text */
    .step-text {
      flex: 1;
      margin: 0;

      font-size: 16px;
      line-height: 1.2;
      font-weight: 600;
    }

    /* Ready button */
    .ready-button {
      display: block;
      width: calc(100% - 44px);
      height: 68px;
      margin: 50px auto 0;

      border: 1px solid var(--border);
      border-radius: 100px;

      background: var(--pink);
      color: #000;

      box-shadow: 0 5px 6px rgba(0, 0, 0, 0.25);
      font: 400 30px Karla, sans-serif;
      cursor: pointer;
    }

    /* Small movement when pressed */
    .ready-button:active {
      transform: translateY(1px);
    }

    /* Makes the phone frame fill smaller screens */
    @media (max-width: 393px) {
      .phone {
        width: 100%;
      }
    }
  </style>
</head>

<body>

  <!-- Main mobile frame -->
  <main class="phone">

    <!-- Main intro content -->
    <section class="content">

      <!-- Welcome heading -->
      <h1>Welcome!</h1>

      <!-- App title -->
      <h2 class="title">
        MAKEUP<br>
        RECOMMENDER
      </h2>

      <!-- Section heading -->
      <p class="how-it-works">
        How it works
      </p>

      <!-- Instruction cards -->
      <section
        class="steps"
        aria-label="How the makeup recommender works"
      >

        <!-- First instruction card remains a grey placeholder -->
        <article class="step-card">
          <img
            class="step-image"
            src="../assets/filter_preview.png"
            alt="Product filters screen"
          >

          <p class="step-text">
            Add your preferences<br>
            in the Homepage for<br>
            skin type, styles, and<br>
            production
          </p>
        </article>

        <!-- Second instruction card uses the face scanner image -->
        <article class="step-card">
          <img
            class="step-image"
            src="../assets/face_scan_preview.png"
            alt="Face scanner screen"
          >

          <p class="step-text">
            Put your face in frame<br>
            and press Ready!
          </p>
        </article>

        <!-- Third instruction card uses the results image -->
        <article class="step-card">
          <img
            class="step-image"
            src="../assets/results_scan_preview.png"
            alt="Face scan results screen"
          >

          <p class="step-text">
            Check out your results<br>
            and recommended<br>
            products!
          </p>
        </article>

      </section>

      <!-- Takes the user to the face scanner -->
      <button
        class="ready-button"
        type="button"
        id="readyButton"
      >
        Ready!
      </button>

    </section>

    <div id="navbar-container"></div>

  </main>

  <!-- Loads the shared navigation JavaScript -->
  <script src="../navigation-bar/script.js"></script>

  <script>
    /*
      Sends the user to the face scanner
      when Ready is clicked.
    */
    document
      .getElementById("readyButton")
      .addEventListener("click", () => {
        window.location.href = "face_scan.html";
      });
  </script>

</body>
</html>
