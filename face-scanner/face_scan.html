<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <!-- Makes the page responsive on different mobile devices -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>MatchUp - Face Scan</title>

  <link rel="stylesheet" href="../navigation-bar/styles.css">
  <!-- Imports the Karla font used on the scanner page -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Karla:wght@400;500;600;700&display=swap"
    rel="stylesheet"
  >

  <style>
    /* Main colors used on the page */
    :root {
      --pink: #f7a0b0;
      --border: #9f1f47;
      --page-pink: #fff8f9;
    }

    /* Makes sizing easier to control */
    * {
      box-sizing: border-box;
    }

    /* General page styling */
    body {
      margin: 0;
      min-height: 100vh;
      background: #eee;
      font-family: Karla, sans-serif;
    }

    /* Responsive mobile frame */
    .phone {
      position: relative;
      width: 100%;
      max-width: 393px;
      min-height: 100svh;
      margin: 0 auto;
      overflow: hidden;

      /* Pink-to-white background gradient */
      background: linear-gradient(
        #fdecef 0%,
        var(--page-pink) 55%,
        #fff 100%
      );
    }

    /*
      Live camera preview.

      The video is mirrored so it behaves
      like a normal front-facing selfie camera.
    */
    #camera {
      position: absolute;
      inset: 0 0 66px;

      width: 100%;
      height: calc(100% - 66px);

      background: #d9d9d9;
      object-fit: cover;

      /* Mirrors the front-facing camera */
      transform: scaleX(-1);
    }

    /*
      Adds a subtle tint above the camera preview
      so the scanner matches the rest of the design.
    */
    .camera-tint {
      position: absolute;
      inset: 0 0 66px;

      background: rgba(255, 248, 249, 0.16);
      pointer-events: none;
    }

    /*
      Close button in the upper-left corner.
    */
    .close-button {
      position: absolute;
      z-index: 5;

      top: 18px;
      left: 19px;

      width: 45px;
      height: 45px;

      border: 0;
      border-radius: 8px;

      background: #fff;
      box-shadow: 0 4px 5px rgba(0, 0, 0, 0.25);

      cursor: pointer;
    }

    /* First diagonal line of the X */
    .close-button::before,
    /* Second diagonal line of the X */
    .close-button::after {
      content: "";

      position: absolute;
      top: 21px;
      left: 5px;

      width: 35px;
      height: 4px;

      background: #000;
      transform: rotate(45deg);
    }

    /* Rotates the second line in the opposite direction */
    .close-button::after {
      transform: rotate(-45deg);
    }

    /*
      Keeps the scanner elements above
      the camera preview.
    */
    .scan-title,
    .scan-status,
    .camera-message,
    .scan-message,
    .ready-button,
    .face-frame,
    .scan-line {
      z-index: 3;
    }

    /* Scanner title */
    .scan-title {
      position: absolute;
      top: 75px;
      left: 50%;

      transform: translateX(-50%);
      margin: 0;

      color: #000;
      font-size: 30px;
      white-space: nowrap;
    }

    /*
      Displays the current scanner status,
      such as “No face detected” or “Face detected”.
    */
    .scan-status {
      position: absolute;
      top: 125px;
      left: 50%;

      width: 205px;
      min-height: 48px;

      display: flex;
      justify-content: center;
      align-items: center;

      padding: 8px 14px;
      transform: translateX(-50%);

      border-radius: 30px;
      background: #fff;
      box-shadow: 0 5px 6px rgba(0, 0, 0, 0.25);

      text-align: center;
      font-size: 20px;
    }

    /*
      Messages that explain what the user
      should do while scanning.
    */
    .camera-message,
    .scan-message {
      position: absolute;
      left: 50%;

      width: 88%;

      transform: translateX(-50%);

      text-align: center;
      font-size: 17px;
      font-weight: 600;
    }

    /* Camera permission or camera error message */
    .camera-message {
      top: 190px;
      color: var(--border);
    }

    /* Face-positioning instructions */
    .scan-message {
      top: 235px;
      color: #000;
    }

    /*
      White face-positioning frame.

      The Ready button stays disabled until
      the user's face is inside this frame.
    */
    .face-frame {
      position: absolute;
      top: 300px;
      left: 28px;

      width: calc(100% - 56px);
      height: 390px;

      border: 5px solid #fff;
      box-shadow: 0 0 0 9999px rgba(0, 0, 0, 0.12);

      pointer-events: none;
    }

    /*
      Pink scanning bar that moves vertically
      inside the face frame.
    */
    .scan-line {
      position: absolute;
      top: 305px;
      left: 33px;

      width: calc(100% - 66px);
      height: 4px;

      background: var(--pink);
      box-shadow: 0 0 12px var(--pink);

      animation: scan 2.2s ease-in-out infinite alternate;
      pointer-events: none;
    }

    /* Moves the scanning bar up and down */
    @keyframes scan {
      from {
        transform: translateY(0);
      }

      to {
        transform: translateY(380px);
      }
    }

    /*
      Ready button at the bottom of the scanner.
    */
    .ready-button {
      position: absolute;
      bottom: 85px;
      left: 50%;

      width: 220px;
      height: 55px;

      transform: translateX(-50%);

      border: 1px solid var(--border);
      border-radius: 100px;

      background: var(--pink);
      box-shadow: 0 5px 6px rgba(0, 0, 0, 0.25);

      font: 400 25px Karla, sans-serif;
      cursor: pointer;
    }

    /* Makes the button appear disabled */
    .ready-button:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    /* Small movement when the enabled button is clicked */
    .ready-button:active:not(:disabled) {
      transform: translateX(-50%) translateY(1px);
    }

  </style>
</head>

<body>

  <!-- Main mobile scanner frame -->
  <main class="phone">

    <!-- Live camera feed -->
    <video
      id="camera"
      autoplay
      playsinline
      muted
    ></video>

    <!-- Light overlay above the camera -->
    <div
      class="camera-tint"
      aria-hidden="true"
    ></div>

    <!-- Close scanner button -->
    <button
      class="close-button"
      type="button"
      aria-label="Close face scan"
    ></button>

    <!-- Scanner heading -->
    <h1 class="scan-title">
      Scanning Face
    </h1>

    <!-- Current scanner status -->
    <div
      class="scan-status"
      id="scanStatus"
    >
      Starting camera...
    </div>

    <!-- Camera permission message -->
    <p
      class="camera-message"
      id="cameraMessage"
    ></p>

    <!-- Face-positioning instructions -->
    <p
      class="scan-message"
      id="scanMessage"
    >
      Center your face inside the frame.
    </p>

    <!-- Face-positioning frame -->
    <div
      class="face-frame"
      aria-label="Face positioning frame"
    ></div>

    <!-- Animated scanning bar -->
    <div
      class="scan-line"
      aria-hidden="true"
    ></div>

    <!-- Ready button -->
    <button
      class="ready-button"
      id="readyButton"
      type="button"
      disabled
    >
      Ready!
    </button>

    <div id="navbar-container"></div>
  </main>

  <!-- Loads the shared navigation JavaScript -->
  <script src="../navigation-bar/script.js"></script>

  <!-- MediaPipe Face Landmarker scanner logic -->
  <script type="module">

    /*
      Imports MediaPipe tools from the CDN.

      Face Landmarker gives the scanner
      detailed facial landmark points.
    */
    import {
      FilesetResolver,
      FaceLandmarker
    } from
      "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@latest/vision_bundle.mjs";

    /*
      Gets references to the page elements.
    */
    const video = document.getElementById("camera");
    const readyButton = document.getElementById("readyButton");
    const scanStatus = document.getElementById("scanStatus");
    const cameraMessage = document.getElementById("cameraMessage");
    const scanMessage = document.getElementById("scanMessage");

    /*
      Creates an invisible canvas.

      The canvas is used to sample camera pixels
      for the skin-depth estimate.
    */
    const canvas = document.createElement("canvas");

    const context = canvas.getContext(
      "2d",
      {
        willReadFrequently: true
      }
    );

    /*
      Variables used by the scanner.
    */
    let faceLandmarker;
    let latestLandmarks = null;
    let cameraStream = null;
    let lastVideoTime = -1;

    /*
      These colors are only the visual colors
      used on the results page.

      They are not compared directly against
      camera pixels because lighting changes
      camera colors significantly.
    */
    const skinPalette = {
      Fair: "#F7DCC8",
      Light: "#E9B99B",
      Medium: "#CC987D",
      Tan: "#A9684D",
      Deep: "#75402F"
    };

    /*
      Finds a point between two facial landmarks.

      This helps move the sample point inward
      so we do not sample shadows at the edge
      of the user's face.
    */
    function betweenPoints(pointA, pointB, amount) {
      return {
        x: pointA.x + (pointB.x - pointA.x) * amount,
        y: pointA.y + (pointB.y - pointA.y) * amount
      };
    }

    /*
      Gets the median RGB value from a small
      square area around a facial landmark.

      A patch is more reliable than one pixel
      because it reduces camera noise and shadows.
    */
    function getMedianPixel(point) {
      const x = Math.round(point.x * canvas.width);
      const y = Math.round(point.y * canvas.height);

      const sampleSize = 9;
      const halfSize = Math.floor(sampleSize / 2);

      const red = [];
      const green = [];
      const blue = [];

      /*
        Reads several pixels around the selected point.
      */
      for (
        let offsetY = -halfSize;
        offsetY <= halfSize;
        offsetY++
      ) {
        for (
          let offsetX = -halfSize;
          offsetX <= halfSize;
          offsetX++
        ) {
          const pixelX = Math.max(
            0,
            Math.min(
              canvas.width - 1,
              x + offsetX
            )
          );

          const pixelY = Math.max(
            0,
            Math.min(
              canvas.height - 1,
              y + offsetY
            )
          );

          const pixel = context.getImageData(
            pixelX,
            pixelY,
            1,
            1
          ).data;

          red.push(pixel[0]);
          green.push(pixel[1]);
          blue.push(pixel[2]);
        }
      }

      /*
        Finds the middle value in each color channel.
      */
      function median(values) {
        values.sort((a, b) => a - b);
        return values[Math.floor(values.length / 2)];
      }

      return {
        red: median(red),
        green: median(green),
        blue: median(blue)
      };
    }

    /*
      Estimates skin depth using brightness thresholds.

      Deep now requires genuinely low brightness.
      This prevents medium skin from being classified
      as Deep because of camera shadows.
    */
    function classifySkinDepth(points) {
      const centerPoint = points[1] || points[4];

      /*
        If the center landmark is unavailable,
        use Medium as a safe fallback.
      */
      if (!centerPoint) {
        return "Medium";
      }

      /*
        Samples inward cheek areas, forehead,
        and additional cheek landmarks.
      */
      const samplePoints = [
        betweenPoints(points[234], centerPoint, 0.38),
        betweenPoints(points[454], centerPoint, 0.38),
        betweenPoints(points[10], centerPoint, 0.30),
        points[116],
        points[345]
      ].filter(Boolean);

      /*
        Gets a median RGB sample for every point.
      */
      const samples = samplePoints.map((point) => {
        return getMedianPixel(point);
      });

      /*
        Uses Medium as a fallback if no samples exist.
      */
      if (!samples.length) {
        return "Medium";
      }

      /*
        Converts every sample into brightness.

        The formula weights green slightly more
        because human vision is more sensitive to it.
      */
      const brightnessValues = samples.map((sample) => {
        return (
          sample.red * 0.299 +
          sample.green * 0.587 +
          sample.blue * 0.114
        );
      });

      /*
        Calculates the average brightness
        across all sampled face areas.
      */
      const averageBrightness =
        brightnessValues.reduce(
          (total, value) => total + value,
          0
        ) / brightnessValues.length;

      /*
        Converts brightness into one of the
        five generalized skin-depth categories.
      */
      if (averageBrightness >= 215) {
        return "Fair";
      }

      if (averageBrightness >= 180) {
        return "Light";
      }

      if (averageBrightness >= 135) {
        return "Medium";
      }

      if (averageBrightness >= 95) {
        return "Tan";
      }

      return "Deep";
    }

    /*
      Estimates the general face shape
      using facial landmark width ratios.
    */
    function classifyFaceShape(points) {
      const width = Math.abs(
        points[234].x - points[454].x
      );

      const height = Math.abs(
        points[10].y - points[152].y
      );

      const ratio = width / Math.max(height, 0.001);

      if (ratio > 0.92) {
        return "Round";
      }

      if (ratio < 0.68) {
        return "Oblong";
      }

      const forehead = Math.abs(
        points[127].x - points[356].x
      );

      const cheek = width;

      const jaw = Math.abs(
        points[172].x - points[397].x
      );

      if (
        forehead > cheek * 1.04 &&
        jaw < cheek * 0.84
      ) {
        return "Heart";
      }

      if (jaw > cheek * 0.95) {
        return "Square";
      }

      if (
        forehead < cheek * 0.82 &&
        jaw < cheek * 0.82
      ) {
        return "Diamond";
      }

      return "Oval";
    }

    /*
      Calculates eye width, height,
      and corner slope.
    */
    function eyeMetrics(
      points,
      outer,
      inner,
      top,
      bottom
    ) {
      return {
        width: Math.abs(
          points[outer].x - points[inner].x
        ),

        height: Math.abs(
          points[top].y - points[bottom].y
        ),

        slope:
          points[outer].y - points[inner].y
      };
    }

    /*
      Estimates the general eye shape.
    */
    function classifyEyeShape(points) {
      const left = eyeMetrics(
        points,
        33,
        133,
        159,
        145
      );

      const right = eyeMetrics(
        points,
        263,
        362,
        386,
        374
      );

      const ratio =
        (
          left.height / left.width +
          right.height / right.width
        ) / 2;

      const slope =
        (left.slope - right.slope) / 2;

      if (ratio > 0.42) {
        return "Round";
      }

      if (slope < -0.018) {
        return "Upturned";
      }

      if (slope > 0.018) {
        return "Downturned";
      }

      if (ratio < 0.25) {
        return "Hooded";
      }

      return "Almond";
    }

    /*
      Estimates the general nose shape.
    */
    function classifyNoseShape(points) {
      const bridge = Math.abs(
        points[6].y - points[168].y
      );

      const noseWidth = Math.abs(
        points[48].x - points[278].x
      );

      const noseLength = Math.abs(
        points[6].y - points[2].y
      );

      const widthRatio =
        noseWidth / Math.max(noseLength, 0.001);

      if (widthRatio > 0.72) {
        return "Wide";
      }

      if (noseLength < bridge * 0.72) {
        return "Button";
      }

      if (points[2].y < points[6].y) {
        return "Upturned";
      }

      if (widthRatio < 0.42) {
        return "Straight";
      }

      return "Roman";
    }

    /*
      Analyzes all facial categories
      when the user presses Ready.
    */
    function analyzeFace(points) {
      /* Matches the canvas to the camera resolution */
      canvas.width = video.videoWidth;
      canvas.height = video.videoHeight;

      /* Draws the current camera frame onto the canvas */
      context.drawImage(
        video,
        0,
        0,
        canvas.width,
        canvas.height
      );

      /*
        Returns all detected categories.
      */
      return {
        skinDepth: classifySkinDepth(points),
        eyeShape: classifyEyeShape(points),
        noseShape: classifyNoseShape(points),
        faceShape: classifyFaceShape(points)
      };
    }

    /*
      Checks whether the entire face
      is inside the scanner frame.
    */
    function faceIsInsideFrame(points) {
      const xs = points.map((point) => point.x);
      const ys = points.map((point) => point.y);

      const minX = Math.min(...xs);
      const maxX = Math.max(...xs);
      const minY = Math.min(...ys);
      const maxY = Math.max(...ys);

      const width = maxX - minX;
      const height = maxY - minY;

      const centered =
        minX > 0.12 &&
        maxX < 0.88 &&
        minY > 0.08 &&
        maxY < 0.90;

      return (
        centered &&
        width > 0.22 &&
        height > 0.28 &&
        width < 0.82
      );
    }

    /*
      Updates the scanner message
      based on the current face position.
    */
    function updateFaceStatus(points) {
      /*
        No face was detected.
      */
      if (!points) {
        latestLandmarks = null;
        readyButton.disabled = true;

        scanStatus.textContent = "No face detected";
        scanMessage.textContent =
          "Move your face into the white frame.";

        return;
      }

      /*
        A face exists, but it is not positioned correctly.
      */
      if (!faceIsInsideFrame(points)) {
        latestLandmarks = null;
        readyButton.disabled = true;

        scanStatus.textContent = "Adjust your position";
        scanMessage.textContent =
          "Keep your whole face inside the white frame.";

        return;
      }

      /*
        The face is correctly positioned.
      */
      latestLandmarks = points;
      readyButton.disabled = false;

      scanStatus.textContent = "Face detected";
      scanMessage.textContent = "Perfect. Tap Ready!";
    }

    /*
      Continuously analyzes the live camera feed.
    */
    async function detectLoop() {
      /*
        Only analyzes a new video frame
        when the video time has changed.
      */
      if (
        video.readyState >= 2 &&
        video.currentTime !== lastVideoTime
      ) {
        lastVideoTime = video.currentTime;

        const result =
          faceLandmarker.detectForVideo(
            video,
            performance.now()
          );

        updateFaceStatus(
          result.faceLandmarks?.[0] || null
        );
      }

      /*
        Runs the detector again
        on the next animation frame.
      */
      requestAnimationFrame(detectLoop);
    }

    /*
      Starts the camera and MediaPipe detector.
    */
    async function start() {
      try {
        /*
          Requests access to the front-facing camera.
        */
        cameraStream =
          await navigator.mediaDevices.getUserMedia({
            video: {
              facingMode: "user"
            },
            audio: false
          });

        /* Displays the camera stream */
        video.srcObject = cameraStream;

        /* Starts playing the video */
        await video.play();

        cameraMessage.textContent = "";
        scanStatus.textContent =
          "Looking for your face...";

        /*
          Loads the MediaPipe vision files.
        */
        const vision =
          await FilesetResolver.forVisionTasks(
            "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@latest/wasm"
          );

        /*
          Creates the Face Landmarker.
        */
        faceLandmarker =
          await FaceLandmarker.createFromOptions(
            vision,
            {
              baseOptions: {
                modelAssetPath:
                  "https://storage.googleapis.com/mediapipe-models/face_landmarker/face_landmarker/float16/1/face_landmarker.task",

                delegate: "GPU"
              },

              runningMode: "VIDEO",
              numFaces: 1,
              outputFaceBlendshapes: false
            }
          );

        /* Begins scanning the live camera feed */
        detectLoop();

      } catch (error) {
        /*
          Displays a helpful message if
          camera access or MediaPipe fails.
        */
        console.error(error);

        scanStatus.textContent =
          "Camera unavailable";

        cameraMessage.textContent =
          "Allow camera access, then reload this page.";

        scanMessage.textContent =
          "The scanner needs a live camera to continue.";
      }
    }

    /*
      Runs when the user presses Ready.
    */
    readyButton.addEventListener(
      "click",
      async () => {
        /*
          Prevents scanning if the face
          is not correctly positioned.
        */
        if (!latestLandmarks) {
          return;
        }

        readyButton.disabled = true;

        scanStatus.textContent =
          "Analyzing your features...";

        scanMessage.textContent =
          "Hold still for a moment.";

        /*
          Determines skin depth and facial features.
        */
        const analysis =
          analyzeFace(latestLandmarks);

        /*
          Gives the scanner time to display
          the analyzing message.
        */
        await new Promise((resolve) => {
          setTimeout(resolve, 1200);
        });

        /*
          Stops the camera before leaving the page.
        */
        cameraStream?.getTracks().forEach((track) => {
          track.stop();
        });

        /*
          Sends the detected values
          to results_scan.html.
        */
        const params =
          new URLSearchParams(analysis);

        window.location.href =
          `results_scan.html?${params.toString()}`;
      }
    );

    /*
      Sends the user back to intro_scan.html
      when they press the X button.
    */
    document
      .querySelector(".close-button")
      .addEventListener("click", () => {
        cameraStream?.getTracks().forEach((track) => {
          track.stop();
        });

        window.location.href = "intro_scan.html";
      });

    /*
      Starts the scanner when the page loads.
    */
    start();

  </script>
</body>
</html>
