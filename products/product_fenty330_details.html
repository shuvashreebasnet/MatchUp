<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Fenty Pro Filt’r Shade 330</title>

  <!-- Shared navigation styles -->
  <link rel="stylesheet" href="../navigation-bar/styles.css">

  <!-- Karla font -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Karla:wght@400;500;600;700&display=swap"
    rel="stylesheet"
  >

  <style>
    :root {
      --pink: #f7a0b0;
      --border: #9f1f47;
      --page-pink: #fff5f6;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background: #eee;
      font-family: Karla, sans-serif;
      color: #000;
    }

    /* Mobile phone frame */
    .phone {
      position: relative;
      width: 100%;
      max-width: 393px;
      height: min(852px, 100svh);
      margin: 0 auto;
      overflow: hidden;

      background: linear-gradient(
        #fdecef 0%,
        var(--page-pink) 55%,
        #fff 100%
      );
    }

    /* Scrollable product content */
    .page {
      height: 100%;
      min-height: 0;
      padding-bottom: 160px;
      overflow-y: auto;
    }

    /* Back button */
    .back-button {
      position: absolute;
      z-index: 2;
      top: 22px;
      left: 15px;

      width: 64px;
      height: 64px;
      padding: 8px;

      border: 0;
      border-radius: 15px;
      background: #fff;
      box-shadow: 0 4px 5px rgba(0, 0, 0, .25);
      cursor: pointer;
    }

    .back-button img {
      width: 100%;
      height: 100%;
      object-fit: contain;
    }

    /* Product title */
    .product-title {
      margin: 118px 20px 10px;
      font-size: clamp(22px, 7vw, 28px);
      line-height: 1.05;
      font-weight: 500;
      white-space: normal;
    }

    /* Rating section */
    .rating-row {
      height: 37px;
      display: flex;
      align-items: center;
      gap: 2px;
      padding: 0 10px;
      font-size: 17px;
    }

    .stars {
      font-size: 30px;
      letter-spacing: -5px;
      line-height: 1;
    }

    .reviews {
      margin-left: 5px;
      white-space: nowrap;
    }

    /* Recommendation banner */
    .recommendation {
      min-height: 29px;
      height: auto;
      padding: 5px 10px;

      background: var(--pink);
      font-size: 15px;
      line-height: 1.2;
      white-space: normal;
    }

    .recommendation span {
      margin-left: 4px;
      color: var(--border);
    }

    /* Product image */
    .product-image {
      width: 340px;
      height: 340px;
      margin: 36px auto 22px;
      background: #fff;
    }

    .product-image img {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: contain;
    }

    /* Product dots */
    .dots {
      display: flex;
      justify-content: center;
      gap: 27px;
      margin-bottom: 25px;
    }

    .dot {
      width: 19px;
      height: 19px;
      border: 0;
      border-radius: 50%;
      background: #d9d9d9;
    }

    .dot.active {
      background: #000;
    }

    /* Product price */
    .price {
      margin: 0 0 8px;
      text-align: center;
      font-size: 31px;
      font-weight: 600;
    }

    /* Product tags */
    .tags {
      display: flex;
      flex-wrap: wrap;
      gap: 8px 12px;
      padding: 0 24px;
    }

    .tag {
      height: 33px;
      display: flex;
      align-items: center;
      padding: 0 14px;

      border-radius: 20px;
      background: #cdeac6;

      font-size: 18px;
      white-space: nowrap;
    }

    .tag.eco {
      background: #d9d9d9;
    }

    .tag img {
      width: 25px;
      height: 25px;
      margin-left: 5px;
      object-fit: contain;
    }

    /* Product description */
    .description {
      margin: 18px 20px 0;
    }

    .description h2 {
      margin: 0;
      font-size: 25px;
      font-weight: 600;
    }

    .description p {
      margin: 0;
      font-size: 16px;
      font-weight: 600;
    }

    /* Fixed action buttons above the navbar */
    .actions {
      position: absolute;
      z-index: 4;
      right: 0;
      bottom: 66px;
      left: 0;

      display: flex;
      align-items: center;
      gap: 18px;

      margin: 0;
      padding: 8px 20px;

      background: rgba(255, 255, 255, .96);
    }

    /* Favorite button */
    .heart-button {
      width: 57px;
      height: 57px;
      padding: 0;

      border: 0;
      border-radius: 50%;
      background: transparent;
      cursor: pointer;
    }

    .heart-button img {
      width: 100%;
      height: 100%;
      object-fit: contain;
    }

    /* External product link */
    .list-button {
      flex: 1;
      height: 58px;

      display: flex;
      align-items: center;
      justify-content: center;

      border: 1px solid var(--border);
      border-radius: 100px;
      background: var(--pink);
      box-shadow: 0 4px 5px rgba(0, 0, 0, .22);

      color: #000;
      font: 400 29px Karla, sans-serif;
      text-decoration: none;
      cursor: pointer;
    }

    .list-button:active {
      transform: translateY(1px);
    }
  </style>
</head>

<body>
  <main class="phone">

    <!-- Scrollable product content -->
    <section class="page">

      <!-- Back button -->
      <button
        class="back-button"
        type="button"
        aria-label="Back to results"
      >
        <img src="../assets/back_arrow.png" alt="">
      </button>

      <!-- Product title -->
      <h1 class="product-title">
        Fenty Pro Filt’r Shade 330
      </h1>

      <!-- Ratings -->
      <div class="rating-row">
        <span class="stars">★ ★ ☆ ☆ ☆</span>
        <span class="reviews">3k reviews</span>
      </div>

      <!-- Recommendation -->
      <div class="recommendation">
        Highly rated by customers for:
        <span>Blendability, Texture, Shade Match</span>
      </div>

      <!-- Product image -->
      <div
        class="product-image"
        aria-label="Product image"
      >
        <img
          src="../assets/makeup-products/fenty_330.png"
          alt="Fenty Pro Filt’r foundation shade 330"
        >
      </div>

      <!-- Product dots -->
      <div class="dots" aria-hidden="true">
        <span class="dot active"></span>
        <span class="dot"></span>
        <span class="dot"></span>
        <span class="dot"></span>
      </div>

      <!-- Price -->
      <p class="price">$24.00</p>

      <!-- Product tags -->
      <div class="tags">
        <div class="tag">$5 - $25</div>

        <div class="tag">
          Cruelty-free
          <img src="../assets/bunny.png" alt="">
        </div>

        <div class="tag">Dry Skin</div>

        <div class="tag eco">
          Eco-friendly
          <img src="../assets/leaf.png" alt="">
        </div>
      </div>

      <!-- Product description -->
      <section class="description">
        <h2>Product Description</h2>
        <p>[product description]</p>
      </section>
    </section>

    <!-- Fixed action buttons -->
    <div class="actions">
      <button
        class="heart-button"
        id="heartButton"
        type="button"
        aria-label="Add to favorites"
      >
        <img
          id="heartImage"
          src="../assets/hearted.png"
          alt="Favorite"
        >
      </button>

      <a
        class="list-button"
        href="https://fentybeauty.com/products/pro-filtr-soft-matte-longwear-foundation-185"
        target="_blank"
        rel="noopener noreferrer"
      >
        Go to site
      </a>
    </div>

    <!-- Shared navigation bar loads here -->
    <div id="navbar-container"></div>
  </main>

  <!-- Favorite button behavior -->
  <script>
    document.querySelector(".back-button").addEventListener("click", () => {
      window.history.back();
    });

    const heartButton =
      document.getElementById("heartButton");

    const heartImage =
      document.getElementById("heartImage");

    let heartClickedF330 = false;

    heartButton.addEventListener("mouseenter", () => {
      if (!heartClickedF330) {
        heartImage.src =
          "../assets/hover_heart.png";
      }
    });

    heartButton.addEventListener("mouseleave", () => {
      if (!heartClickedF330) {
        heartImage.src =
          "../assets/hearted.png";
      }
    });

    heartButton.addEventListener("click", () => {
      heartClickedF330 = !heartClickedF330;
      localStorage.setItem('heartClickedF330', heartClickedF330);

      heartImage.src = heartClickedF330
        ? "../assets/clicked_heart.png"
        : "../assets/hearted.png";
    });
  </script>

  <!-- Loads the shared navigation bar -->
  <script src="../navigation-bar/script.js"></script>
</body>
</html>
