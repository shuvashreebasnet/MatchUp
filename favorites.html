<!DOCTYPE html>
<html>
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>MatchUp - Dashboard</title>
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Karla:ital,wght@0,300;1,300&display=swap" rel="stylesheet">
        <style>
            :root {
            --field-pink: #fbcdd5;
            --border: #9f1f47;
            --placeholder: #666666;
            }

            * {
            box-sizing: border-box;
            }

            body {
            margin: 0;
            min-height: 100vh;
            background: #f4f4f4;
            font-family: Karla, sans-serif;
            }

            /* Responsive mobile frame */
            main.phone {
            position: relative;
            width: 100%;
            max-width: 393px;
            min-height: 100svh;
            margin: 0 auto;
            overflow: hidden;

            background: linear-gradient(
                to bottom,
                #fdecef 0%,
                #fffafa 57%,
                #ffffff 100%
            );
            }

            .page {
            min-height: 100svh;
            padding: 32px 22px;
            }

            h1 {
            font-size: 28px;
            text-align: center;
            line-height: 1.05;
            font-weight: 500
            }

            .img-box {
                height: 110px;
                width: 110px;
                background-color: #ffffff;
                box-shadow: 0px 4px 4px 0px rgba(0, 0, 0, 0.25);
                display: flex;
                justify-content: center;
                align-items: center;
                position: relative;
            }

            .row {
                display: flex;
                flex-wrap: wrap;
                align-items: center;
                justify-content: left;
                gap: 10px;
                width: 350px;
            }

            .corner-icon {
                position: absolute;
                top: 10px;
                left: 10px;
                z-index: 2;
                width: 20px;
            }
            
            a {
                color: initial;
                font-size: 15px;
                position: absolute;
                bottom: 10px;
                text-decoration: none;
            }

            .product-img
            {
                height: 80px;
            }
        </style>
    </head>

    <body>
        <main class="phone">
            <section class="page">
                <div style="display:flex;justify-content:center">
                    <img src="../assets/matchup-logo.svg" alt="logo" style="height:40px">
                </div>
                <h1>Favorites</h1>
                <div class="row" id="row"></div>
            </section>
        </main>
    </body>
</html>
