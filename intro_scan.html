<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MatchUp - Makeup Recommender</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Karla:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --pink: #f7a0b0;
      --border: #9f1f47;
      --page-pink: #fff5f6;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      background: #eeeeee;
      font-family: Karla, sans-serif;
      color: #000;
    }

    .phone {
      position: relative;
      width: 393px;
      min-height: 852px;
      margin: 0 auto;
      overflow: hidden;
      background: linear-gradient(#fdecef 0%, var(--page-pink) 55%, #fff 100%);
    }

    .content {
      min-height: 852px;
      padding: 38px 18px 93px;
      overflow-y: auto;
    }

    h1 {
      margin: 35px 0 38px;
      text-align: center;
      font-size: 34px;
      line-height: 1;
      font-weight: 700;
    }

    .title {
      margin: 0 auto 32px;
      text-align: center;
      font-size: 40px;
      line-height: .95;
      font-weight: 800;
      letter-spacing: 1px;
    }

    .how-it-works {
      margin: 0 0 10px;
      text-align: center;
      font-size: 20px;
      font-weight: 400;
    }

    .steps {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .step-card {
      display: flex;
      align-items: center;
      width: 100%;
      min-height: 100px;
      border-radius: 26px;
      background: #fff;
      box-shadow: 0 7px 6px rgba(0, 0, 0, .25);
    }

    .step-image {
      position: relative;
      left: 15px;
      flex: 0 0 143px;
      width: 90px;
      height: 80px;
      margin-right: 40px;
      background: #d9d9d9;
      object-fit: cover;
    }

    .step-text {
      margin: 0;
      font-size: 16px;
      line-height: 1.12;
      font-weight: 600;
    }

    .ready-button {
      display: block;
      width: calc(100% - 44px);
      height: 68px;
      margin: 50px auto 0;
      border: 1px solid var(--border);
      border-radius: 100px;
      background: var(--pink);
      box-shadow: 0 5px 6px rgba(0, 0, 0, .25);
      color: #000;
      font: 400 30px Karla, sans-serif;
      cursor: pointer;
    }

    .ready-button:active { transform: translateY(1px); }

    .bottom-nav {
      position: absolute;
      right: 0;
      bottom: 0;
      left: 0;
      display: flex;
      justify-content: space-around;
      align-items: center;
      height: 72px;
      border-top: 1px solid #000;
      background: #fff;
    }

    .nav-button {
      position: relative;
      display: flex;
      justify-content: center;
      align-items: center;
      width: 55px;
      height: 60px;
      border: 0;
      background: transparent;
      cursor: pointer;
    }

    .nav-button img {
      width: 43px;
      height: 43px;
      object-fit: contain;
    }

    .nav-button.active::before {
      content: "";
      position: absolute;
      top: 0;
      width: 60px;
      height: 9px;
      background: var(--pink);
    }

    @media (max-width: 393px) {
      .phone { width: 100%; }
    }
  </style>
</head>
<body>
  <main class="phone">
    <section class="content">
      <h1>Welcome!</h1>
      <h2 class="title">MAKEUP<br>RECOMMENDER</h2>
      <p class="how-it-works">How it works</p>

      <section class="steps" aria-label="How the makeup recommender works">
        <article class="step-card">
          <div class="step-image" aria-label="Instruction image placeholder"></div>
          <p class="step-text">Add your preferences<br>in the Homepage for<br>skin type, styles, and<br>production</p>
        </article>

        <article class="step-card">
          <div class="step-image" aria-label="Instruction image placeholder"></div>
          <p class="step-text">Put your face in frame<br>and press Ready!</p>
        </article>

        <article class="step-card">
          <div class="step-image" aria-label="Instruction image placeholder"></div>
          <p class="step-text">Check out your results<br>and recommended<br>products!</p>
        </article>
      </section>

      <button class="ready-button" type="button" id="readyButton">Ready!</button>
    </section>

    <nav class="bottom-nav" aria-label="Main navigation">
      <button class="nav-button" type="button" aria-label="Home">
        <img src="assets/house.png" alt="">
      </button>
      <button class="nav-button" type="button" aria-label="Saved">
        <img src="assets/saved.png" alt="">
      </button>
      <button class="nav-button active" type="button" aria-label="Makeup scanner">
        <img src="assets/lookup.png" alt="">
      </button>
      <button class="nav-button" type="button" aria-label="Favorites">
        <img src="assets/favorites.png" alt="">
      </button>
      <button class="nav-button" type="button" aria-label="Profile">
        <img src="assets/settings.png" alt="">
      </button>
    </nav>
  </main>

  <script>
    document.getElementById('readyButton').addEventListener('click', () => {
      window.location.href = 'face_scan.html';
    });
  </script>
</body>
</html>
