<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MatchUp - Makeup Recommender</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Karla:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --pink: #f7a0b0;
      --border: #9f1f47;
      --page-pink: #fff5f6;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      background: #eeeeee;
      font-family: Karla, sans-serif;
      color: #000;
    }

    .phone {
      position: relative;
      width: 100%;
      max-width: 393px;
      min-height: 100svh;
      margin: 0 auto;
      overflow: hidden;
      background: linear-gradient(
        #fdecef 0%,
        var(--page-pink) 55%,
        #fff 100%
      );
    }

    .content {
      min-height: 852px;
      padding: 38px 18px 93px;
      overflow-y: auto;
    }

    h1 {
      margin: 35px 0 38px;
      text-align: center;
      font-size: 34px;
      line-height: 1;
      font-weight: 700;
    }

    .title {
      margin: 0 auto 32px;
      text-align: center;
      font-size: 40px;
      line-height: .95;
      font-weight: 800;
      letter-spacing: 1px;
    }

    .how-it-works {
      margin: 0 0 10px;
      text-align: center;
      font-size: 20px;
      font-weight: 400;
    }

    .steps {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .step-card {
      display: flex;
      align-items: center;
      width: 100%;
      min-height: 100px;
      border-radius: 26px;
      background: #fff;
      box-shadow: 0 7px 6px rgba(0, 0, 0, .25);
    }

    .step-image {
      position: relative;
      left: 15px;
      flex: 0 0 143px;
      width: 90px;
      height: 80px;
      margin-right: 40px;
      background: #d9d9d9;
      object-fit: cover;
    }

    .step-text {
      margin: 0;
      font-size: 16px;
      line-height: 1.12;
      font-weight: 600;
    }

    .ready-button {
      display: block;
      width: calc(100% - 44px);
      height: 68px;
      margin: 50px auto 0;
      border: 1px solid var(--border);
      border-radius: 100px;
      background: var(--pink);
      box-shadow: 0 5px 6px rgba(0, 0, 0, .25);
      color: #000;
      font: 400 30px Karla, sans-serif;
      cursor: pointer;
    }

    .ready-button:active { transform: translateY(1px); }

    /* Teammate's navigation bar */
    .navbar {
      position: absolute;
      z-index: 1000;
      right: 0;
      bottom: 0;
      left: 0;

      height: 66px;
      border-top: 1px solid #000;
      background: #fff;
    }

    .navbar ul {
      display: flex;
      align-items: center;
      justify-content: space-around;

      height: 100%;
      margin: 0;
      padding: 0 6px;

      list-style: none;
    }

    .navbar ul li {
      position: relative;

      display: flex;
      flex: 1;
      justify-content: center;

      height: 100%;
    }

    .navbar ul li a {
      display: flex;
      align-items: center;
      justify-content: center;

      width: 100%;
      padding: 8px;
    }

    .navbar ul li img {
      width: 33px;
      height: 33px;
      object-fit: contain;
      transition: transform 200ms ease;
    }

    .navbar ul li.active img {
      transform: translateY(-3px) scale(1.2);
    }

    @media (max-width: 393px) {
      .phone { width: 100%; }
    }
  </style>
</head>
<body>
  <main class="phone">
    <section class="content">
      <h1>Welcome!</h1>
      <h2 class="title">MAKEUP<br>RECOMMENDER</h2>
      <p class="how-it-works">How it works</p>

      <section class="steps" aria-label="How the makeup recommender works">
        <article class="step-card">
          <div class="step-image" aria-label="Instruction image placeholder"></div>
          <p class="step-text">Add your preferences<br>in the Homepage for<br>skin type, styles, and<br>production</p>
        </article>

        <article class="step-card">
          <div class="step-image" aria-label="Instruction image placeholder"></div>
          <p class="step-text">Put your face in frame<br>and press Ready!</p>
        </article>

        <article class="step-card">
          <div class="step-image" aria-label="Instruction image placeholder"></div>
          <p class="step-text">Check out your results<br>and recommended<br>products!</p>
        </article>
      </section>

      <button class="ready-button" type="button" id="readyButton">Ready!</button>
    </section>

    <nav class="navbar" aria-label="Main navigation">
      <ul>
        <li>
          <a href="#" aria-label="Home">
            <img
              src="assets/navbar-icons/home-icon-black.png"
              data-black="assets/navbar-icons/home-icon-black.png"
              data-pink="assets/navbar-icons/home-icon-pink.png"
              alt=""
            >
          </a>
        </li>
    
        <li>
          <a href="#" aria-label="Favorites">
            <img
              src="assets/navbar-icons/favorites-icon-black.png"
              data-black="assets/navbar-icons/favorites-icon-black.png"
              data-pink="assets/navbar-icons/favorites-icon-pink.png"
              alt=""
            >
          </a>
        </li>
    
        <!-- Scan is active on intro_scan.html -->
        <li class="active">
          <a href="intro_scan.html" aria-label="Scan" aria-current="page">
            <img
              src="assets/navbar-icons/scan-icon-pink.png"
              data-black="assets/navbar-icons/scan-icon-black.png"
              data-pink="assets/navbar-icons/scan-icon-pink.png"
              alt=""
            >
          </a>
        </li>
    
        <li>
          <a href="#" aria-label="Browse">
            <img
              src="assets/navbar-icons/browse-icon-black.png"
              data-black="assets/navbar-icons/browse-icon-black.png"
              data-pink="assets/navbar-icons/browse-icon-pink.png"
              alt=""
            >
          </a>
        </li>
    
        <li>
          <a href="#" aria-label="Account">
            <img
              src="assets/navbar-icons/account-icon-black.png"
              data-black="assets/navbar-icons/account-icon-black.png"
              data-pink="assets/navbar-icons/account-icon-pink.png"
              alt=""
            >
          </a>
        </li>
      </ul>
    </nav>
  </main>

  <script src="script.js"></script>

  <script>
    document.getElementById('readyButton').addEventListener('click', () => {
      window.location.href = 'face_scan.html';
    });
  </script>
</body>
</html>
