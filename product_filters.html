<!DOCTYPE html>
<html>
    <head>
        <meta charset="utf-8">
        <title> Product Filters </title>
        <link rel="stylesheet" href="styles.css">
    </head>

    <body>
        
        <form class="phone">
            <h1>Filters</h1>
            <div class="price-range">
                <h4> Price: </h4>
                <input type="checkbox" id="0-25"> $0 - $25 <br>
                <input type="checkbox" id="25-50"> $25 - $50 <br>
                <input type="checkbox" id="50-75"> $50 - $75 <br>
                <input type="checkbox" id="75-100"> $75 - $100 <br>
                <input type="checkbox" id="100-125"> $100 - $125 <br>
                <input type="checkbox" id="150-175"> $150 - $175 <br>
                <input type="checkbox" id="175-200"> $175 - $200 <br>
            </div>
            
            <div class="makeup-brands">
                <h4> Search Brands: </h4>
                <input type="checkbox"> Fenty Beauty <br>
                <input type="checkbox"> L'Oréal Paris <br>
                <input type="checkbox"> MAC <br>
                <input type="checkbox"> NARS <br>
                <input type="checkbox"> Shiseido <br>
            </div><br>
            
            <div class="ingredient-menu">
                <h4> Allergens to Exclude: </h4>
                <select name="Natural Rubber">
                    <option>Natural Rubber</option>
                    <option> N/A </option>
                    <option> Latex </option>
                </select> 

                <select name="Metals">
                    <option>Metals</option>
                    <option> N/A </option>
                    <option> Gold </option>
                    <option> Nickel </option>
                </select> <br>

                <select name="Dyes">
                    <option>Dyes</option>
                    <option> N/A </option>
                    <option> Coal-tar </option>
                    <option> PPD </option>
                </select> 

                <select name="Fragrances">
                    <option> Fragrances </option>
                    <option> N/A </option>
                    <option> Citral </option>
                    <option> Citronellol </option>
                    <option> Geraniol </option>
                    <option> Limolene </option>
                    <option> Linalool </option>
                </select> 

                <select name="Preservatives">
                    <option> Perservatives </option>
                    <option> N/A </option>
                    <option> CMIT </option>
                    <option> Formaldehyde and formaldehyde releasing ingredients </option>
                    <option> MIT </option>
                </select> <br>
                <input type="checkbox"> I'm not allergic to any of these.
            </div> <br>
            
            <div class="ethical-production-tags">
                <h4> Ethical Production: </h4>
                <div>
                    <input type="checkbox" name="cruelty-free"> Cruelty-Free 
                    <img src="bunny-removebg-preview.png" width="15px" height="15px" style="background-color: #fff;">
                </div>
                <div id="eco-friendly">
                    <input type="checkbox" name="eco-friendly"> Eco-Friendly
                    <img src="leaf-removebg-preview.png" width="15px" height="15px">
                </div>           
            </div> <br>
            
            <div class="filter-management-buttons" style="margin-left: 60px;">
                <button type="reset" style="font-size: large; background-color: #fbcdd5;"> Clear All </button>
                <button id="save_button" onclick="save()" style="font-size: large;"> <strong>Save and Apply</strong></button>
            </div>
            <script>
                function save(){
                    document.getElementById("save_button").innerHTML = "Saved";
                    document.getElementById("save_button").style = "background-color:#CEE9C7;font-size: large; font-weight:bold;";
                }
            </script>
        </form>
    </body>
</html>
